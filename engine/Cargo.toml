[package]
name = "mailviewer-engine"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
cfb = "0.16"
encoding_rs = "0.8"
mail-parser = "1.0.1"
memchr = "2"
outlook-pst-ost = { version = "1.3", path = "vendor/outlook-pst-ost" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
