name: Refresh README media

on:
  push:
    branches: [main]
    paths:
      - "README*.md"
      - "src/**"
      - "assets/**"
      - "third_party/**"
      - "tests/fixtures/readme-demo/**"
      - "preview/**"
      - "tools/FlowSmoke/**"
      - "tools/probe-windows-desktop.py"
      - "tools/run-flow-smoke.py"
      - "tools/update-readme-media.py"
      - ".github/workflows/readme-media.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-media
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the attachment preview worker
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --manifest-path preview/Cargo.toml --release --locked
      - name: Capture the English app and rebuild the README media
        run: |
          python -m pip install Pillow==11.0.0
          python tools/update-readme-media.py
      - name: Publish only the generated PNGs and GIF
        run: |
          git add -- docs/media/attachment-preview-dark.png docs/media/anomaly-evidence-dark.png docs/media/full-app-walkthrough-dark.gif
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh English README media'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/main
