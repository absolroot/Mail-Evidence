name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update

      - name: Build the Rust mail reader
        run: cargo build --locked --manifest-path engine/Cargo.toml

      - name: Build the Windows app
        run: dotnet build MailViewer.slnx --configuration Release -p:MailFormatWorker="$PWD/engine/target/debug/mailviewer-engine.exe"

      - name: Run mail evidence regression tests
        run: dotnet run --no-build --configuration Release --project tests/MailViewer.Verification -- --synthetic-only

      - name: Verify the Rust reader on the synthetic mailbox
        run: |
          $json = & ./engine/target/debug/mailviewer-engine.exe report tests/fixtures/synthetic/synthetic.mbox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = ($json -join "`n") | ConvertFrom-Json
          if ($report.counts.messages -ne 3 -or $report.counts.attachments -ne 1 -or $report.failures.Count -ne 0) {
            throw 'Unexpected Rust reader result for the synthetic mailbox.'
          }
          Write-Output 'Rust reader found 3 messages and 1 attachment.'
